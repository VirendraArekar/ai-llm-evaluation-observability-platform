apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aetherllm
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "llmops"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aether-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aether-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: aetherllm
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
