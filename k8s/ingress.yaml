apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aether-ingress
  namespace: aetherllm
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  tls:
    - hosts:
        - aetherllm.ai
        - app.aetherllm.ai
      secretName: aether-tls-secret
  rules:
    - host: app.aetherllm.ai
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aether-backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aether-frontend-service
                port:
                  number: 80
